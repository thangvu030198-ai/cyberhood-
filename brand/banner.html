const q = new URLSearchParams(location.search);
const KIND = q.get('kind') || 'banner';
const [W, H] = KIND === 'og' ? [1200, 630] : [1500, 500];
const PR = +(q.get('pr') || 2);
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px'; stage.className = KIND;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const CYAN = new THREE.Color(0x00d9ff), PINK = new THREE.Color(0xff1fb4), GOLD = new THREE.Color(0xffb81c);

{

/* procedural skyline far behind */
function skyline(z0, spread, count, hMin, hMax, seed) {
  let s = seed; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const tex = canvasTex(64, 128, (g) => { g.fillStyle = '#05030b'; g.fillRect(0, 0, 64, 128); for (let y = 6; y < 128; y += 10) for (let x = 5; x < 64; x += 10) { const r = rnd(); if (r < 0.6) continue; g.fillStyle = r < 0.78 ? '#5de9ff' : r < 0.92 ? '#ff5cc8' : '#ffd36e'; g.globalAlpha = 0.4 + rnd() * 0.6; g.fillRect(x, y, 5, 5); } g.globalAlpha = 1; });
  for (let i = 0; i < count; i++) {
    const w = 1.2 + rnd() * 2.6, h = hMin + rnd() * (hMax - hMin), d = 1.5 + rnd() * 2;
    const t = tex.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.max(1, Math.round(w / 1.2)), Math.max(1, Math.round(h / 2)));

    m.position.set((rnd() - 0.5) * spread, h / 2, z0 - rnd() * 10); scene.add(m);
    if (rnd() < 0.45) { const strip = new THREE.Mesh(new THREE.BoxGeometry(w + 0.05, 0.08, d + 0.05), glow(rnd() < 0.5 ? CYAN : PINK, 2.2)); strip.position.set(m.position.x, h, m.position.z); scene.add(strip); }
  }
}
skyline(-34, 120, 60, 3, 19, 11);
skyline(-24, 90, 34, 2, 9, 23);
// synthwave sun behind the hero
{
  const t = canvasTex(1024, 1024, (g, w) => { const lg = g.createLinearGradient(0, 0, 0, w); lg.addColorStop(0, '#ffe37a'); lg.addColorStop(0.45, '#ff8a3d'); lg.addColorStop(1, '#ff1f9b'); g.fillStyle = lg; g.beginPath(); g.arc(w / 2, w / 2, w / 2 - 2, 0, Math.PI * 2); g.fill(); g.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 5; i++) g.fillRect(0, w * (0.5 + i * 0.05), w, 4 + i * 3.4); g.fillRect(0, w * 0.74, w, w); });

  halo.position.set(HERO_X * 9, 11, -56); halo.userData.noReflect = true; scene.add(halo);

/* lights */
scene.add(new THREE.HemisphereLight(0x9a7dff, 0x0a0420, 0.7));
const key = new THREE.DirectionalLight(0xffe2f4, 1.9); key.position.set(-3, 4, 4); scene.add(key);
const rimC = new THREE.DirectionalLight(0x22e6ff, 3.2); rimC.position.set(3.5, 2.4, -2.5); scene.add(rimC);

/* ================= 3D title: smooth rounded bevel, glossy gradient + neon backing ================= */
async function title() {
  const font = new FontLoader().parse(await (await fetch('fonts/chakra-petch-bold.typeface.json')).json());
  const size = wide ? 0.4 : 0.36;
  const geo = new TextGeometry('CYBERHOOD', { font, size, depth: size * 0.32, curveSegments: 16, bevelEnabled: true, bevelThickness: size * 0.07, bevelSize: size * 0.045, bevelOffset: 0, bevelSegments: 12 });
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  geo.translate(-bb.min.x, -bb.min.y, -(bb.max.z + bb.min.z) / 2);
  // vertical gradient on the face: white-cyan top → hot pink bottom
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), h = bb.max.y - bb.min.y;
  const top = new THREE.Color(0x8ff3ff), mid = new THREE.Color(0x14b8ff), bot = new THREE.Color(0xff1f9a), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const t = THREE.MathUtils.clamp(pos.getY(i) / h, 0, 1);
    if (t > 0.5) c.copy(mid).lerp(top, (t - 0.5) / 0.5); else c.copy(bot).lerp(mid, t / 0.5);
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({ vertexColors: true, metalness: 0.35, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.08, iridescence: 0.3, iridescenceIOR: 1.4, envMapIntensity: 0.7, emissive: 0x2a0a40, emissiveIntensity: 0.12 });
  const mesh = new THREE.Mesh(geo, mat);
  // soft neon backing: same letters, fatter and further back, glowing pink → blooms into a halo
  const back = new TextGeometry('CYBERHOOD', { font, size, depth: 0.01, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.004, bevelSize: size * 0.06, bevelSegments: 2 });
  back.translate(-bb.min.x, -bb.min.y, -(bb.max.z + bb.min.z) / 2 - size * 0.35);
  const halo = new THREE.Mesh(back, glow(PINK, 1.3));
  const g = new THREE.Group(); g.add(halo, mesh);
  const textW = bb.max.x - bb.min.x;
  return { g, textW };
}

/* ================= Hunters ================= */
function fit(model, height) {
  model.updateMatrixWorld(true);
  let minY = Infinity, headY = -Infinity; const v = new THREE.Vector3();
  model.traverse((o) => { if (o.isBone) { o.getWorldPosition(v); minY = Math.min(minY, v.y); if (/^Head$|Head$/.test(o.name)) headY = Math.max(headY, v.y); } });
  if (!isFinite(headY)) { const b = new THREE.Box3().setFromObject(model); minY = b.min.y; headY = b.min.y + (b.max.y - b.min.y) * 0.89; }
  const s = height / ((headY - minY) / 0.89);
  model.scale.multiplyScalar(s); model.position.y = -minY * s;
  model.traverse((o) => { if (o.isMesh) { o.frustumCulled = false; if (o.material && o.material.map) { o.material.emissiveMap = o.material.map; o.material.emissive = new THREE.Color(0xffffff); o.material.emissiveIntensity = 0.1; } } });
}
async function hunter(base, x, z, ry, t = 1.2) {

  const m = g.scene; m.position.set(x, 0, z); m.rotation.y = ry; scene.add(m);
  const clip = idle.animations[0];
  if (clip) { clip.tracks = clip.tracks.filter((tr) => !/Hips\.position/.test(tr.name)); const mx = new THREE.AnimationMixer(m); mx.clipAction(clip).play(); mx.update(t); }

}

/* the site's hero: hands on a tablet that projects a ring of Genesis cards */
const RARITY = { Common: '#9aa3b5', Rare: '#3fa9ff', Epic: '#b45cff', Legendary: '#ffb800', Mythic: '#ff2a6d' };
const ITEMS = [['Thunder Spear', 'Mythic', 0.049, 0], ['Leviathan Scale', 'Mythic', 0.046, 1], ['Oni Helm', 'Legendary', 0.032, 3], ['Chrono Cube', 'Legendary', 0.036, 4], ['Cosmic Edge', 'Legendary', 0.038, 6], ['Demonic Bow', 'Legendary', 0.039, 15], ['Void Crystal', 'Mythic', 0.045, 16], ['Circuit Core Egg', 'Mythic', 0.05, 26]];
function card(atlas, [name, rarity, price, i]) {

  return canvasTex(512, 704, (g, w, h) => {
    g.fillStyle = 'rgba(6,4,20,0.86)'; g.fillRect(0, 0, w, h);
    const grd = g.createRadialGradient(w / 2, 460, 20, w / 2, 460, 400); grd.addColorStop(0, col + 'cc'); grd.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = grd; g.fillRect(0, 0, w, 520);
    g.imageSmoothingEnabled = false;
    if (atlas) { const cs = atlas.width / 6; g.drawImage(atlas, (i % 6) * cs, Math.floor(i / 6) * cs, cs, cs, 64, 48, 384, 384); }
    g.strokeStyle = col; g.lineWidth = 8; g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = col; g.fillRect(8, 8, 150, 40); g.fillStyle = '#05020c'; g.font = '700 26px "JetBrains Mono"'; g.textBaseline = 'middle'; g.fillText(rarity.toUpperCase(), 20, 29);
    g.fillStyle = '#fff'; g.font = '700 44px "Chakra Petch"'; g.fillText(name, 32, 504, w - 64);
    g.fillStyle = col; g.font = '700 52px "Chakra Petch"'; g.fillText(price + ' ETH', 32, 584);
    g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '500 26px "JetBrains Mono"'; g.fillText('#' + String(i + 1).padStart(3, '0') + ' · GENESIS', 32, 650);

}
const beamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false,
  uniforms: { color: { value: new THREE.Color(0.25, 1.6, 2.0) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 color; varying vec2 vUv; void main(){ float fade = smoothstep(0.0,0.2,vUv.y) * (1.0 - vUv.y); float scan = 0.6 + 0.4 * sin(vUv.y * 70.0); float st = 0.55 + 0.45 * step(0.5, fract(vUv.x * 28.0)); gl_FragColor = vec4(color * scan * st, fade * 0.11); }',

async function hero() {

  const [g, idle, atlas] = await Promise.all([load('/web/assets/models/vex.glb.wasm'), load('/web/assets/models/idle.glb.wasm'), loadImg('/web/assets/img/nft-atlas.png')]);

  const model = g.scene; fit(model, 1.75); root.add(model);
  const bones = {}; model.traverse((o) => { if (o.isBone) bones[o.name] = o; });

  }

  const b = bones;
  if (b.LeftArm) { aim(b.LeftArm, b.LeftForeArm, L(0.25, 1.06, 0.12)); aim(b.LeftForeArm, b.LeftHand, L(0.15, 1.06, 0.36)); }
  if (b.RightArm) { aim(b.RightArm, b.RightForeArm, L(-0.25, 1.06, 0.12)); aim(b.RightForeArm, b.RightHand, L(-0.15, 1.06, 0.36)); }

  const scr = canvasTex(256, 170, (g) => { g.fillStyle = '#04121e'; g.fillRect(0, 0, 256, 170); g.strokeStyle = '#22e6ff'; g.lineWidth = 2; for (let r = 0; r < 4; r++) { g.beginPath(); g.arc(128, 85, 18 + r * 16, 0, 6.3); g.globalAlpha = 0.85 - r * 0.18; g.stroke(); } g.globalAlpha = 1; g.fillStyle = '#ff2a8a'; g.font = '700 16px "Chakra Petch"'; g.fillText('GENESIS', 10, 22); g.fillStyle = '#7dffb0'; g.font = '600 12px "JetBrains Mono"'; g.fillText('● PROJECTING', 150, 22); });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.31, 0.2), new THREE.MeshBasicMaterial({ map: scr, toneMapped: false, color: new THREE.Color(1.6, 1.6, 1.6) }));
  screen.rotation.x = -Math.PI / 2; screen.position.y = 0.0095; tablet.add(screen);
  // hologram: beam + rings + orbiting cards
  const holo = new THREE.Group(); holo.position.set(0, 1.1, 0.38); root.add(holo);
  const R = 0.8, HH = 0.5;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(R, 0.14, HH, 64, 1, true), beamMat); beam.position.y = HH / 2; holo.add(beam);
  [[0.0, 0.16, 0.2, '#22e6ff', 32, 0.3], [HH * 0.55, R * 0.62, R * 0.64, '#ff2a8a', 48, 1.1], [HH, R, R + 0.028, '#22e6ff', 64, 2.2]].forEach(([y, a, bb, c, seg, rz]) => {
    const m = new THREE.Mesh(new THREE.RingGeometry(a, bb, 160), new THREE.MeshBasicMaterial({ map: ringTex(seg, c), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false, color: new THREE.Color(1.8, 1.8, 1.8) }));

    const a = (k / n) * Math.PI * 2 + spin;
    const front = Math.cos(a) * 0.5 + 0.5;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.31, 0.426), new THREE.MeshBasicMaterial({ map: card(atlas, it), transparent: true, opacity: 0.45 + front * 0.55, side: THREE.DoubleSide, toneMapped: false, depthWrite: false, color: new THREE.Color(1.15, 1.15, 1.15) }));
    m.position.set(Math.sin(a) * R, HH + 0.22, Math.cos(a) * R);
    holo.add(m); m.updateMatrixWorld(true);
    const wp = new THREE.Vector3(); m.getWorldPosition(wp); m.lookAt(cam.position.x, wp.y, cam.position.z);
    m.scale.setScalar(0.85 + front * 0.3);
  });
  // rising sparks inside the beam
  const PN = 160, pos = new Float32Array(PN * 3); let s = 9; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < PN; i++) { const h = rnd(), ang = rnd() * 6.3, rad = 0.12 + h * R * 0.85 * (0.4 + rnd() * 0.6); pos.set([Math.cos(ang) * rad, h * HH, Math.sin(ang) * rad], i * 3); }
  const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  holo.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: new THREE.Color(0.6, 2.4, 2.6), size: 0.02, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })));
  const hl = new THREE.PointLight(0x37e8ff, 1.4, 4, 1.4); hl.position.set(0, 0.5, 0.3); holo.add(hl);
  // floor rings under the hero
  [[1.05, 1.1, PINK, 1.6], [1.45, 1.47, CYAN, 1.4], [0.55, 0.57, CYAN, 1.2]].forEach(([a, bb, c, k]) => { const m = new THREE.Mesh(new THREE.RingGeometry(a, bb, 128), glow(c, k)); m.rotation.x = -Math.PI / 2; m.position.y = 0.01; root.add(m); });
}

const [{ g: titleG, textW }] = await Promise.all([title(), hero(),
  hunter('/game/public/models/mx_cls_samurai', HERO_X + (wide ? 1.35 : 1.2), -0.9, -0.6, 0.6),

]);

else { titleG.position.set(-2.5, 2.05, 0.2); titleG.scale.setScalar(2.55 / textW); }
titleG.rotation.set(-0.04, 0.2, 0);
scene.add(titleG);
titleG.children[1].layers.set(2);
scene.traverse((o) => { if (o.isLight) o.layers.enable(2); });

const rt = new THREE.WebGLRenderTarget(W * PR, H * PR, { samples: 4, type: THREE.HalfFloatType });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(PR); composer.setSize(W, H);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W * PR, H * PR), 0.55, 0.42, 1.0));
composer.addPass(new OutputPass());
composer.render();
// title face drawn after bloom so it stays crisp; only its pink backing feeds the glow
renderer.autoClear = false; renderer.clearDepth();

renderer.render(scene, cam);
