# CYBERHOOD — Nginx cho website (cyberhood.xyz) và game (play.cyberhood.xyz) trên Ubuntu.
# Cài: sudo cp deploy/nginx.conf /etc/nginx/sites-available/cyberhood && sudo ln -sf ../sites-available/cyberhood /etc/nginx/sites-enabled/
# Sau đó: sudo certbot --nginx -d cyberhood.xyz -d www.cyberhood.xyz -d play.cyberhood.xyz
# Đổi tên miền ở 3 dòng server_name nếu dùng tên khác.

# gzip on; đã có sẵn trong /etc/nginx/nginx.conf của Ubuntu (khai báo lại sẽ lỗi duplicate)
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm application/octet-stream;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------------- Website ----------------
server {
  listen 80;
  server_name cyberhood.xyz www.cyberhood.xyz;
  root /var/www/cyberhood/web;
  include /etc/nginx/mime.types;
  types { application/wasm wasm; }

  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /assets/js/config.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri $uri/ /index.html; }

  # Viết bài X theo chủ đề -> systemd cyberhood-postai trên cổng 8790 (key OpenAI chỉ nằm trên server)
  location /api/post {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
    client_max_body_size 4k;
  }
}

# ---------------- Game ----------------
server {
  listen 80;
  server_name play.cyberhood.xyz;
  root /var/www/cyberhood/play/current;
  include /etc/nginx/mime.types;
  types { model/gltf-binary glb; application/wasm wasm; }

  # index.html luôn lấy bản mới; JS/CSS có mã băm trong tên nên cache vĩnh viễn
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.json { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /models/ { add_header Cache-Control "public, max-age=2592000"; }
  location /mattes/ { add_header Cache-Control "public, max-age=2592000"; }
  location / { try_files $uri $uri/ /index.html; }

  # Server chơi chung (WebSocket) -> systemd cyberhood-rt trên cổng 8787
  location /rt {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
