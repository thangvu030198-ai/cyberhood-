<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CYBERHOOD 3D logo</title>
<!-- Renders the arrow-through-H logo as extruded neon 3D. Open via a local server from the repo root:
     /brand/logo3d.html?size=1024&bg=1&yaw=-0.42&pitch=0.18   (bg=0 → transparent PNG)  window.__png() returns a data URL -->
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/game/node_modules/three/build/three.module.js","three/addons/":"/game/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const SIZE = +(q.get('size') || 1024), BG = q.get('bg') !== '0';
const YAW = +(q.get('yaw') ?? -0.42), PITCH = +(q.get('pitch') ?? 0.18), SPIN = q.has('spin');
const CYAN = 0x00e5ff, PINK = 0xff2fd0, GOLD = 0xffc400;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE);
renderer.toneMapping = THREE.NoToneMapping; // keep neon saturated (ACES washes cyan/pink out)
renderer.setClearColor(0x000000, 0);
document.body.append(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(28, 1, 1, 5000);
cam.position.set(0, 0, +(q.get("dist") || 860));

/* ---- shapes in the original 400×400 logo space (y down), centred at 200,200 ---- */
const P = (x, y) => new THREE.Vector2(x - 200, 200 - y);
function poly(pts) { const s = new THREE.Shape(pts.map(([x, y]) => P(x, y))); return s; }
function rectHole(x, y, w, h) { return new THREE.Path([P(x, y), P(x, y + h), P(x + w, y + h), P(x + w, y)]); }
function building(outline, windows) { const s = poly(outline); windows.forEach((w) => s.holes.push(rectHole(...w))); return s; }

const win = (cols, rows, x0, y0, dx, dy, w = 7, h = 9) => { const out = []; for (const r of rows) for (const c of cols) out.push([x0 + c * dx, y0 + r * dy, w, h]); return out; };
const leftTop = building([[130, 135], [147, 118], [170, 118], [170, 188], [130, 188]], win([0, 1], [0, 1], 139, 147, 16, 20));
const leftBot = building([[130, 222], [170, 222], [170, 288], [130, 288]], win([0, 1], [0, 1], 139, 233, 16, 20));
const rightTop = building([[230, 103], [255, 103], [270, 118], [270, 188], [230, 188]], win([0, 1], [0, 1, 2], 239, 132, 16, 20));
const antenna = poly([[237, 80], [242, 80], [242, 104], [237, 104]]);
const rightBot = building([[230, 222], [270, 222], [270, 288], [230, 288]], win([0, 1], [0, 1, 2], 239, 232, 16, 19));
const arrow = poly([[84, 188], [101, 188], [112, 199], [276, 199], [276, 183], [312, 205], [276, 227], [276, 211], [112, 211], [101, 222], [84, 222], [95, 205]]);

/* ---- neon material: lit body + emissive glow; brighter emissive edges come from the bevel catching light ---- */
function mat(color, glow) {
  return new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: glow, metalness: 0.35, roughness: 0.28 });
}
const group = new THREE.Group();
function add(shape, color, depth, z, glow = 0.42) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 3, bevelSize: 2.2, bevelSegments: 3, curveSegments: 4 });
  g.translate(0, 0, z - depth / 2);
  const m = new THREE.Mesh(g, [mat(color, glow), mat(new THREE.Color(color).multiplyScalar(0.55).getHex(), glow * 0.45)]);
  group.add(m);
  return m;
}
add(leftTop, CYAN, 26, 0); add(leftBot, CYAN, 26, 0);
add(rightTop, PINK, 26, 0); add(rightBot, PINK, 26, 0); add(antenna, PINK, 10, 0);
add(arrow, GOLD, 34, 16, 0.5); // the arrow passes in front, between the two halves
scene.add(group);

/* ---- ring + glow disc behind, like the flat logo ---- */
if (BG) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(176, 1.3, 8, 160), new THREE.MeshBasicMaterial({ color: 0x1e7f8f }));
  ring.position.z = -60; scene.add(ring);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(176, 96), new THREE.MeshBasicMaterial({ color: 0x0c0718 }));
  disc.position.z = -64; scene.add(disc);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(120, 64), new THREE.MeshBasicMaterial({ color: 0x3a1050, transparent: true, opacity: 0.35 }));
  halo.position.z = -62; scene.add(halo);
  scene.background = new THREE.Color(0x07040f);
}
scene.add(new THREE.HemisphereLight(0x9fd8ff, 0x220a33, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-300, 400, 600); scene.add(key);
const rim = new THREE.DirectionalLight(0xff4fd8, 1.6); rim.position.set(400, -100, -300); scene.add(rim);

group.rotation.set(PITCH, YAW, 0.02);

const composer = new EffectComposer(renderer);
composer.setSize(SIZE, SIZE);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(SIZE, SIZE), 0.55, 0.45, 0.55));
composer.addPass(new OutputPass());

function draw(t = 0) {
  if (SPIN) group.rotation.y = YAW + Math.sin(t * Math.PI * 2) * 0.55;
  BG ? composer.render() : renderer.render(scene, cam); // bloom pass drops alpha, so transparent renders skip it
}
draw();
window.__frame = (t) => { draw(t); return renderer.domElement.toDataURL('image/png'); };
window.__png = () => renderer.domElement.toDataURL('image/png');
window.__ready = true;
</script>
</body>
</html>
